<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Digital Clock</title>
  </head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .clock-container {
      text-align: center;
      padding: 30px;
      border-radius: 10px;
      background: #222;
    }

    #clock {
      font-size: 50px;
      margin: 0;
    }

    #ampm {
      font-size: 20px;
      margin-bottom: 20px;
    }

    button {
      padding: 8px 15px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }
  </style>
  <body>
    <div class="clock-container">
      <h1 id="clock">00:00:00</h1>
      <p id="ampm">AM</p>

      <button onclick="set12Hour()">12 Hour</button>
      <button onclick="set24Hour()">24 Hour</button>
    </div>

    <script>
      let is24Hours = "False";

      function updateClock() {
        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        let ampm = "Am";

        if (!is24Hours) {
          if (hours >= 12) {
            ampm = "Pm";
          }
          hours = hours % 12 || 12;
        }
        // Add leading zero
        hours = hours < 10 ? "0" + hours : hours;
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;
        document.getElementById(
          "clock"
        ).innerText = `${hours}:${minutes}:${seconds}`;
        document.getElementById("ampm").innerText = is24Hour ? "" : ampm;
      }
      function set12Hour() {
        is24Hour = false;
      }

      function set24Hour() {
        is24Hour = true;
      }

      // Live update every second
      setInterval(updateClock, 1000);

      // Initial call
      updateClock();
    </script>
  </body>
</html>
