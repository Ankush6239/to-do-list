<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <main>
        <div class="container">
            <div class="row mt-5">  
            <div class="card">
            <div class="card-body">
<div class="input-group mt-2 mb-2">
  <input type="text" class="form-control" placeholder="enter the task" aria-label="Username" aria-describedby="basic-addon1" id="getValue">
</div>
<div class="">
 <button class="btn btn-primary mb-2" type="button" id="button">Add Task</button>
</div>
<div>
    <ul class="list-group" id="taskList">

</ul>
</div>
            </div>
           </div>
           </div>

  
 
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
<script>
    document.getElementById("button").addEventListener("click",function(){
     const input = document.getElementById("getValue").value;
      if(input.trim()=== "")return;

      const li = document.createElement("li");
      li.textContent= input;
      li.className= "list-group-item"

      const ul = document.getElementById("taskList");
      ul.appendChild(li);

      document.getElementById("getValue").value = "" ;


});
</script>
</html>
